name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Set up a stable Python version that Buildozer natively supports
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install the required build tools in the cloud environment
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev locales openjdk-17-jdk unzip zip
          pip install --upgrade pip
          pip install buildozer setuptools wheel

      # Automatically accept all Android SDK licenses in advance
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n8933bad161ad24ed14d9a745a56d386b158220f3\nd56f5187479451eabf01fb743144d183306d8435\nd6487e8d97e40d253a487c555f15a34d04813687\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c227374a22015c617b3b2d10cf6541fb\n35105006d64e92a472c05a72a12f900fa4e99f1a\n7a79a69800a98c5c589af163db444a49fc412db1" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      # Compile the actual APK (automatically forcing license acceptance hooks)
      - name: Build with Buildozer
        run: |
          yes | buildozer android debug

      # Upload the compiled app so you can download it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
